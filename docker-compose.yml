services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regtrace
      POSTGRES_PASSWORD: regtrace
      POSTGRES_DB: regtrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regtrace -d regtrace"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://regtrace:regtrace@postgres:5432/regtrace
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./frontend/data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
